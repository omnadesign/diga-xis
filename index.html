<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cabine de Fotos</title>
<style>
:root{--bg:#a8553a;--booth:#f4efe6;--ink:#1b1b1b;--curtain:#2f6b3a;--card:#fffaf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#6e3523;--booth:#e8e2d6;--card:#f1ebdd}}
:root[data-theme="dark"]{--bg:#6e3523;--booth:#e8e2d6;--card:#f1ebdd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
.wrap{display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:flex-start;max-width:960px;width:100%}
.booth{width:320px;max-width:100%}
.sign{background:var(--booth);border:6px solid var(--booth);outline:2px solid var(--ink);margin:0 auto;width:70%;text-align:center;font-weight:900;font-size:28px;letter-spacing:2px;padding:10px 0}
.post{width:70%;height:18px;margin:0 auto;display:flex;justify-content:space-between}
.post i{width:8px;background:var(--booth)}
.body{background:var(--booth);border-radius:6px;padding:14px;position:relative;height:420px;display:flex;gap:10px}
.side{width:22%;background:#e9d5cc;border-radius:4px}
.window{flex:1;background:#222;position:relative;overflow:hidden;border-radius:2px}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:grayscale(1) contrast(1.4);display:none}
.curtain{position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--curtain) 0 18px,#276030 18px 24px);transition:transform .8s ease;transform-origin:top;display:flex;align-items:flex-end;justify-content:center;padding-bottom:20px;color:#fff;font-size:13px;text-align:center}
.open .curtain{transform:translateY(-82%)}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:110px;font-weight:900;color:#fff;text-shadow:0 2px 12px #000;pointer-events:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .35s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.ctrl{margin-top:16px;display:flex;gap:10px;flex-direction:column}
button,.btn{font:inherit;font-weight:700;background:var(--ink);color:#fff;border:0;padding:14px;border-radius:6px;cursor:pointer;text-align:center}
button.alt{background:var(--card);color:var(--ink)}
button:disabled{opacity:.5;cursor:default}
.msg{color:#fff;font-size:14px;min-height:20px;text-align:center}
.stripbox{background:#000;padding:0;border-radius:4px;width:200px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.stripbox canvas{width:100%;display:block}
.empty{width:200px;min-height:120px;border:2px dashed rgba(255,255,255,.5);border-radius:4px;color:#fff;display:flex;align-items:center;text-align:center;padding:16px;font-size:14px}
.disp{width:230px;margin:0 auto}
.dslot{background:var(--booth);border-radius:6px 6px 0 0;padding:14px 0 10px;text-align:center;font-size:12px;letter-spacing:1px;text-transform:uppercase;position:relative;z-index:2}
.dslot::after{content:"";display:block;height:10px;background:#111;border-radius:6px;margin:8px 15px 0;box-shadow:inset 0 3px 4px #000}
.out{width:200px;margin:0 auto;position:relative;z-index:1;clip-path:inset(0 -20px -5000px -20px)}
.stripbox.print{animation:pr 3.5s steps(14,end) forwards}
@keyframes pr{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.guide{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);aspect-ratio:528/364;box-shadow:0 0 0 999px rgba(0,0,0,.55);display:none;pointer-events:none}
.open .guide{display:block}
#fileIn{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="booth" id="booth">
    <div class="sign">PHOTOS</div>
    <div class="post"><i></i><i></i></div>
    <div class="body">
      <div class="side"></div>
      <div class="window">
        <video id="vid" playsinline muted></video>
        <div class="guide"></div>
        <div class="curtain"><span>Entre, feche a cortina<br>e sorria</span></div>
        <div class="count" id="count"></div>
        <div class="flash" id="flash"></div>
      </div>
    </div>
    <div class="ctrl">
      <button id="go">Entrar na cabine</button>
      <button class="alt" id="up">Ou enviar 4 fotos da galeria</button>
      <input type="file" id="fileIn" accept="image/*" multiple>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <div>
    <div class="disp">
      <div class="dslot">retire sua foto</div>
      <div class="out" id="out">
        <div class="empty" id="empty">Sua tirinha vai sair aqui.</div>
        <div class="stripbox" id="stripbox" style="display:none"><canvas id="strip"></canvas></div>
      </div>
    </div>
    <div class="ctrl" id="after" style="display:none;width:200px">
      <select id="lay" style="font:inherit;padding:12px;border-radius:6px;border:0"><option value="12">4,5 × 12 cm</option><option value="14" selected>4,5 × 14 cm</option><option value="16">4,5 × 16 cm</option></select>
      <button id="pdf">Baixar 3 tirinhas em PDF A5</button>
      <button class="alt" id="dl">Baixar PNG</button>
      <button class="alt" id="again">Tirar de novo</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const vid=$('vid'),msg=$('msg'),count=$('count'),flash=$('flash');
let stream=null,busy=false;
const W=500, H=364, PAD=12, GAP=10, BORDER=2;
let currentShots=[];

const wait=ms=>new Promise(r=>setTimeout(r,ms));
let AC=null;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function printSound(){
  const a=ac();if(!a)return;
  const len=Math.floor(a.sampleRate*0.15),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  for(let k=0;k<14;k++){
    const t=a.currentTime+0.05+k*0.25;
    const s=a.createBufferSource();s.buffer=buf;
    const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1800+Math.random()*600;f.Q.value=1.2;
    const g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.5,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
    s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);
  }
}

function grab(src,sw,sh){
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  const r=Math.max(W/sw,H/sh),dw=sw*r,dh=sh*r;
  x.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh);
  const d=x.getImageData(0,0,W,H),p=d.data;
  for(let i=0;i<p.length;i+=4){
    let g=0.3*p[i]+0.59*p[i+1]+0.11*p[i+2];
    g=Math.max(0,Math.min(255,(g-128)*1.55+120));
    p[i]=p[i+1]=p[i+2]=g;
  }
  x.putImageData(d,0,0);
  return c;
}
function grabVideo(){
  const vw=vid.videoWidth,vh=vid.videoHeight,ww=vid.clientWidth,wh=vid.clientHeight;
  const s=Math.max(ww/vw,wh/vh),sw=Math.min(vw,ww/s),sh=Math.min(vh,sw*H/W);
  const c=document.createElement('canvas');c.width=sw;c.height=sh;
  const x=c.getContext('2d');x.translate(sw,0);x.scale(-1,1);
  x.drawImage(vid,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,sw,sh);
  return grab(c,sw,sh);
}

function buildStrip(shots){
  currentShots=shots;
  const cv=$('strip');
  const size=Number($('lay').value)||14;
  cv.width=500;
  cv.height=Math.round(cv.width*size/4.5);
  const x=cv.getContext('2d');
  x.fillStyle='#000';x.fillRect(0,0,cv.width,cv.height);

  const innerW=Math.round((cv.width-PAD*2)*0.62);
  const frameX=Math.round((cv.width-innerW)/2);
  const innerH=cv.height-PAD*2;
  const frameH=(innerH-GAP*(shots.length-1))/shots.length;

  shots.forEach((shot,i)=>{
    const y=PAD+i*(frameH+GAP);
    x.fillStyle='#000';
    x.fillRect(frameX-BORDER,y-BORDER,innerW+2*BORDER,frameH+2*BORDER);
    const sw=shot.width,sh=shot.height;
    const scale=Math.max(innerW/sw,frameH/sh);
    const dw=sw*scale,dh=sh*scale;
    const sx=(dw-innerW)/2,sy=(dh-frameH)/2;
    x.save();
    x.beginPath();x.rect(frameX,y,innerW,frameH);x.clip();
    x.drawImage(shot,frameX-sx,y-sy,dw,dh);
    x.restore();
  });

  $('empty').style.display='none';$('after').style.display='none';
  const sb=$('stripbox');sb.style.display='block';sb.classList.remove('print');void sb.offsetWidth;sb.classList.add('print');
  printSound();setTimeout(()=>{$('after').style.display='flex'},3600);
}

async function startCam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1920},height:{ideal:1440}},audio:false});
    vid.srcObject=stream;await vid.play();vid.style.display='block';return true;
  }catch(e){msg.textContent='Não consegui acessar a câmera. Use a opção de enviar fotos da galeria.';return false;}
}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}vid.style.display='none'}

async function session(){
  ac();if(busy)return;busy=true;$('go').disabled=true;msg.textContent='';
  if(!(await startCam())){busy=false;$('go').disabled=false;return}
  $('booth').classList.add('open');
  await wait(1200);
  const shots=[];
  for(let n=1;n<=4;n++){
    msg.textContent='Foto '+n+' de 4';
    for(let c=3;c>=1;c--){count.textContent=c;await wait(1000)}
    count.textContent='';
    flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go');
    shots.push(grabVideo());
    await wait(500);
  }
  stopCam();$('booth').classList.remove('open');
  msg.textContent='Pronto!';
  buildStrip(shots);
  busy=false;$('go').disabled=false;$('go').textContent='Entrar de novo';
}

$('go').onclick=session;
$('again').onclick=session;
$('up').onclick=()=>$('fileIn').click();
$('fileIn').onchange=e=>{
  ac();const files=[...e.target.files].slice(0,4);
  if(files.length<4){msg.textContent='Escolha 4 fotos.';return}
  Promise.all(files.map(f=>new Promise(res=>{
    const im=new Image();im.onload=()=>res(grab(im,im.naturalWidth,im.naturalHeight));im.src=URL.createObjectURL(f);
  }))).then(buildStrip);
  msg.textContent='';
};
$('pdf').onclick=()=>{
  if(!window.jspdf){msg.textContent='Não consegui carregar o gerador de PDF.';return}
  const cv=$('strip');
  const img=cv.toDataURL('image/jpeg',0.98);
  const stripW=45;
  const stripH=(Number($('lay').value)||14)*10;
  const pageW=148;
  const pageH=210;
  const marginX=4;
  const gap=2;
  const totalW=stripW*3+gap*2;
  const x0=(pageW-totalW)/2;
  const y=(pageH-stripH)/2;
  const doc=new window.jspdf.jsPDF({
    orientation:'portrait',
    unit:'mm',
    format:'a5',
    compress:true
  });
  for(let i=0;i<3;i++){
    const x=x0+i*(stripW+gap);
    doc.addImage(img,'JPEG',x,y,stripW,stripH);
    doc.setDrawColor(0,0,0);
    doc.setLineWidth(0.25);
    doc.rect(x,y,stripW,stripH);
  }
  doc.save('diga-xis-3-tirinhas-4-5x'+(stripH/10)+'cm-a5.pdf');
};
$('lay').onchange=()=>{if(currentShots.length===4)buildStrip(currentShots)};
$('dl').onclick=()=>{
  const a=document.createElement('a');a.download='tirinha-cabine.png';a.href=$('strip').toDataURL('image/png');
  document.body.appendChild(a);a.click();a.remove();
};
</script>
</body>
</html>
